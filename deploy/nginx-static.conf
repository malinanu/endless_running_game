# Optional: serve static files straight from Nginx (faster on phones).
# CloudPanel → Sites → your site → Vhost: paste these blocks inside the `server { … }`
# that listens on 443, ABOVE the existing `location / { … proxy_pass … }` block.
# Replace SITE_USER and DOMAIN.

gzip on;
gzip_types application/javascript text/css application/json model/gltf+json application/octet-stream image/svg+xml;
gzip_min_length 1024;

location ~ ^/(assets|vendor|js|css|icons)/ {
  root /home/SITE_USER/htdocs/DOMAIN/public;
  # JS/CSS change on each deploy; models and textures rarely do.
  location ~ \.(js|css)$ { expires 1h; add_header Cache-Control "public"; }
  expires 30d;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

location = /manifest.webmanifest {
  root /home/SITE_USER/htdocs/DOMAIN/public;
  default_type application/manifest+json;
}
