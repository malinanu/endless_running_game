name: CI

on:
  push:
    branches-ignore: [main]   # main is tested by the deploy workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: API tests
        run: pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for f in public/js/*.js; do
            node --check --input-type=module < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Check deploy script
        run: shellcheck deploy/deploy.sh
