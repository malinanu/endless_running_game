name: Deploy to CloudPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-cloudpanel
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudpanel-test
      url: ${{ vars.APP_URL }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy script on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && git fetch --quiet origin main && git checkout --quiet -f origin/main -- deploy/deploy.sh && bash deploy/deploy.sh main"

      - name: Check the public site
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "${APP_URL%/}/api/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::${APP_URL%/}/api/health is not answering"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
